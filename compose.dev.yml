services:
  db:
    image: redis:8-alpine
    env_file:
      - .env
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --save "" --appendonly no

  mqtt-broker:
    image: eclipse-mosquitto:2.1-alpine
    env_file:
      - .env
    ports:
      - "${MQTT_PORT:-1883}:1883"

  dsg-web:
    image: ghcr.io/prescriptiveanalytics/dsg-web:latest
    ports:
      - "${DSG_PORT:-8080}:8080"
    depends_on:
      - mqtt-broker
