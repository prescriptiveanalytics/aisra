services:
  cert-init:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # Docker Compose creates a directory when a single-file bind mount source
        # is missing, so clean that up before (re)generating the certificate.
        if [ -d /certs/localhost.pfx ]; then
          rm -rf /certs/localhost.pfx
        fi
        if [ ! -s /certs/localhost.pfx ]; then
          dotnet dev-certs https -ep /certs/localhost.pfx -p devpassword
        fi
        chmod 644 /certs/localhost.pfx
    volumes:
      - ./certs:/certs
    restart: "no"
    networks:
      - aisra-net

  db:
    image: redis:8-alpine
    command: redis-server --save "" --appendonly no
    networks:
      - aisra-net

  mqtt-broker:
    image: eclipse-mosquitto:2.1-alpine
    ports:
      - "${MQTT_PORT}:1883"
    networks:
      - aisra-net

  dsg-web:
    image: ghcr.io/prescriptiveanalytics/dsg-web:latest
    depends_on:
      mqtt-broker:
        condition: service_started
    networks:
      - aisra-net

  heuristic-web:
    build:
      context: ./backend/src
      dockerfile: AIsra.HeuristicLibWeb.Server/Dockerfile
    volumes:
      - ./certs:/certs:ro
    environment:
      Kestrel__Certificates__Default__Path: /certs/localhost.pfx
    env_file:
      - .env
    depends_on:
      cert-init:
        condition: service_completed_successfully
    networks:
      - aisra-net

  aisra-web:
    build:
      context: ./backend/src
      dockerfile: AIsra.Web/Dockerfile
    ports:
      - "${AGENT_PORT}:${AGENT_PORT}"
    volumes:
      - ./certs:/certs:ro
    env_file:
      - .env
    environment:
      REDIS_HOST: db
      MQTT_HOST: mqtt-broker
      DSG_URL: "http://dsg-web:8080"
      DSG_BROKER_HOST: mqtt-broker
      HEURISTIC_LIB_SERVER_URL: "https://heuristic-web:5001"
      Kestrel__Certificates__Default__Path: /certs/localhost.pfx
    depends_on:
      cert-init:
        condition: service_completed_successfully
      db:
        condition: service_started
      mqtt-broker:
        condition: service_started
      dsg-web:
        condition: service_started
      heuristic-web:
        condition: service_started
    networks:
      - aisra-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PUBLIC_API_URL: "${PUBLIC_API_URL}"
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    depends_on:
      - aisra-web

networks:
  aisra-net:
    driver: bridge
